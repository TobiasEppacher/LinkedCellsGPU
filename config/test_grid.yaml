# Test config: cuboid initializer (10x10x10 lattice, spacing 1.0 = interaction_radius).
# The lattice stops short of domain_size: box_max belongs to the halo cell, which no
# particle may occupy.
# end_t / delta_t = 10 timesteps.
delta_t: 0.005
end_t: 0.5
domain_size: [10.0, 10.0, 10.0]
interaction_radius: 1.0
epsilon: 1.0
sigma: 0.4

algorithm: kokkos-soa
functor: lj
only_forces: false
output_vtk_files: true
output_dir: "./testoutput"

initializers:
  - type: cuboid
    box_min: [0.0, 0.0, 0.0]
    box_max: [9.0, 9.0, 9.0]
    grid_counts: [20, 20, 20]
